<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="1024" height="1024">
<!-- Frente de cabine premium (genérica, sem marca): luzes âmbar no teto, grade cromada, faróis de LED.
     A cabine fica dentro do círculo central de 80%: serve como "any" e "maskable". -->
<defs>
  <radialGradient id="bg" cx="256" cy="230" r="330" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#1E2024"/><stop offset="1" stop-color="#08090A"/>
  </radialGradient>
  <linearGradient id="paint" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#7A818B"/><stop offset="0.4" stop-color="#454A52"/><stop offset="1" stop-color="#25282D"/>
  </linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2C3846"/><stop offset="1" stop-color="#0C1116"/>
  </linearGradient>
  <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#F1F3F5"/><stop offset="0.5" stop-color="#9AA1AA"/><stop offset="1" stop-color="#5E646C"/>
  </linearGradient>
  <filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<rect width="512" height="512" fill="url(#bg)"/>
<radialGradient id="halo" cx="256" cy="250" r="230" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FFB547" stop-opacity="0.22"/><stop offset="1" stop-color="#FFB547" stop-opacity="0"/></radialGradient><circle cx="256" cy="250" r="230" fill="url(#halo)"/>
<ellipse cx="256" cy="414" rx="160" ry="16" fill="#000" opacity="0.55"/>

<!-- espelhos -->
<rect x="112" y="168" width="22" height="70" rx="8" fill="#1C1E22" stroke="#5E646C" stroke-width="2"/>
<rect x="378" y="168" width="22" height="70" rx="8" fill="#1C1E22" stroke="#5E646C" stroke-width="2"/>
<path d="M134 190 H152 M378 190 H360" stroke="#5E646C" stroke-width="5" stroke-linecap="round"/>

<!-- cabine -->
<rect x="150" y="86" width="212" height="306" rx="30" fill="url(#paint)"/>
<rect x="150.5" y="86.5" width="211" height="305" rx="29.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="2"/>

<!-- luzes do teto -->
<g fill="#FFB547" filter="url(#glow)">
  <rect x="194" y="98" width="20" height="9" rx="4.5"/>
  <rect x="226" y="98" width="20" height="9" rx="4.5"/>
  <rect x="258" y="98" width="20" height="9" rx="4.5"/>
  <rect x="290" y="98" width="20" height="9" rx="4.5"/>
</g>

<!-- para-brisa -->
<path d="M174 122 H338 Q346 122 346 130 L340 204 Q339 212 331 212 H181 Q173 212 172 204 L166 130 Q166 122 174 122 Z" fill="url(#glass)"/>
<path d="M196 122 L246 122 L206 212 L172 212 Z" fill="#FFFFFF" opacity="0.07"/>

<!-- grade cromada -->
<rect x="176" y="228" width="160" height="108" rx="12" fill="#0B0C0E"/>
<g fill="url(#chrome)">
  <rect x="186" y="240" width="140" height="8" rx="4"/>
  <rect x="186" y="257" width="140" height="8" rx="4"/>
  <rect x="186" y="274" width="140" height="8" rx="4"/>
  <rect x="186" y="291" width="140" height="8" rx="4"/>
  <rect x="186" y="308" width="140" height="8" rx="4"/>
</g>
<rect x="176" y="228" width="160" height="108" rx="12" fill="none" stroke="url(#chrome)" stroke-width="3"/>

<!-- faróis com LED âmbar -->
<path d="M156 342 H208 L200 362 H160 Q156 362 156 358 Z" fill="#0E1013" stroke="#5E646C" stroke-width="1.5"/>
<path d="M356 342 H304 L312 362 H352 Q356 362 356 358 Z" fill="#0E1013" stroke="#5E646C" stroke-width="1.5"/>
<g stroke="#FFB547" stroke-width="6" stroke-linecap="round" filter="url(#glow)">
  <path d="M162 348 H200"/>
  <path d="M350 348 H312"/>
</g>

<!-- para-choque -->
<rect x="140" y="370" width="232" height="34" rx="12" fill="#1A1C1F" stroke="#3A3E45" stroke-width="2"/>
<rect x="160" y="383" width="192" height="5" rx="2.5" fill="url(#chrome)" opacity="0.8"/>
</svg>
